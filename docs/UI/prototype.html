<!doctype html>
<meta charset="utf-8">
<title>x2clip — prototype</title>
<style>
:root {
  --bg:#f7f7f8; --bg-row-sel:#e4e7ec; --fg:#111114; --fg-dim:#77777e;
  --line:#e2e2e6; --accent:#2f6feb; --warn:#b25e09; --error:#c0392b;
  --page:#d8d8dc;
  --sans:-apple-system,"Segoe UI",Inter,system-ui,sans-serif;
  --mono:ui-monospace,"SF Mono","JetBrains Mono",monospace;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg:#1c1c1e; --bg-row-sel:#2f3033; --fg:#f2f2f4; --fg-dim:#8b8b93;
    --line:#333337; --accent:#4c8bf5; --warn:#e0913a; --error:#e5645a;
    --page:#0e0e10;
  }
}
* { box-sizing:border-box; margin:0; }
body {
  background:var(--page); color:var(--fg); font:14px/1.5 var(--sans);
  min-height:100vh; display:flex; flex-direction:column; align-items:center;
  gap:20px; padding:28px 16px;
}
.hint { color:var(--fg-dim); font-size:12px; text-align:center; max-width:640px; }
.hint kbd {
  font:11px var(--mono); border:1px solid var(--line); border-radius:4px;
  padding:1px 4px; background:var(--bg);
}

/* ---- cửa sổ lịch sử ---- */
#win {
  width:640px; height:420px; background:var(--bg); border-radius:10px;
  box-shadow:0 12px 40px rgba(0,0,0,.28); display:flex; flex-direction:column;
  overflow:hidden; transition:opacity 80ms;
}
#win.hidden { opacity:0; pointer-events:none; }

.bar { display:flex; align-items:center; gap:8px; padding:0 12px; height:44px;
       border-bottom:1px solid var(--line); flex:none; }
#q { flex:1; border:2px solid transparent; border-radius:6px; background:transparent;
     color:var(--fg); font:15px var(--sans); padding:5px 6px; outline:none; }
#q:focus { border-color:var(--accent); }
#q::placeholder { color:var(--fg-dim); }
.peer { color:var(--fg-dim); font-size:11px; white-space:nowrap; }

#banner { height:28px; display:none; align-items:center; padding:0 12px; gap:8px;
          font-size:12px; flex:none; }
#banner.on { display:flex; }
#banner button { font:11px var(--sans); border:1px solid currentColor; background:none;
                 color:inherit; border-radius:4px; padding:1px 6px; cursor:pointer; }

#list { flex:1; overflow-y:auto; padding:4px 6px; }
.row { display:flex; align-items:center; gap:8px; height:34px; padding:0 6px;
       border-radius:6px; border-left:2px solid transparent; cursor:pointer; }
.row.img { height:64px; }
.row:hover { background:color-mix(in srgb, var(--bg-row-sel) 50%, transparent); }
.row.sel { background:var(--bg-row-sel); border-left-color:var(--accent); }
.row .txt { flex:1; font:13px var(--mono); white-space:nowrap; overflow:hidden;
            text-overflow:ellipsis; }
.row .when { color:var(--fg-dim); font-size:11px; white-space:nowrap; }
.row .pin { color:var(--accent); font-size:11px; }
.row.over .txt { color:var(--warn); }
.row .thumb { width:48px; height:48px; border-radius:4px; object-fit:cover; flex:none; }
.sep { height:1px; background:var(--line); margin:4px 6px; }
.empty { color:var(--fg-dim); font-size:13px; padding:24px 12px; text-align:center; }

.keys { height:28px; display:flex; align-items:center; gap:14px; padding:0 12px;
        border-top:1px solid var(--line); color:var(--fg-dim);
        font-size:11px; font-weight:500; flex:none; }

/* ---- tray ---- */
.side { display:flex; gap:20px; align-items:flex-start; flex-wrap:wrap;
        justify-content:center; }
.tray { width:200px; background:var(--bg); border:1px solid var(--line);
        border-radius:8px; padding:4px 0; font-size:12px;
        box-shadow:0 6px 20px rgba(0,0,0,.18); }
.tray .head { padding:4px 12px; color:var(--fg-dim); }
.tray .head b { color:var(--fg); font-weight:600; }
.tray hr { border:0; border-top:1px solid var(--line); margin:4px 0; }
.tray .mi { padding:4px 12px; display:flex; justify-content:space-between; cursor:pointer; }
.tray .mi:hover { background:var(--bg-row-sel); }
.tray .mi span { color:var(--fg-dim); }

/* ---- bảng điều khiển demo ---- */
.panel { background:var(--bg); border:1px solid var(--line); border-radius:8px;
         padding:10px 12px; font-size:12px; width:200px; }
.panel h4 { font-size:11px; text-transform:uppercase; letter-spacing:.05em;
            color:var(--fg-dim); margin-bottom:6px; font-weight:600; }
.panel button { display:block; width:100%; text-align:left; background:none; color:var(--fg);
                border:0; border-radius:4px; padding:3px 6px; font:12px var(--sans); cursor:pointer; }
.panel button:hover { background:var(--bg-row-sel); }
.panel button.on { background:var(--accent); color:#fff; }

#toast { position:fixed; bottom:24px; background:var(--fg); color:var(--bg);
         padding:8px 14px; border-radius:6px; font-size:12px; opacity:0;
         transition:opacity 120ms; pointer-events:none; }
#toast.on { opacity:1; }
</style>

<p class="hint">
  Prototype <b>x2clip</b> — dữ liệu giả, không chạm clipboard thật.
  Dùng bàn phím:
  <kbd>↑</kbd><kbd>↓</kbd> chọn · <kbd>⏎</kbd> chép · <kbd>⌘P</kbd> ghim ·
  <kbd>⌘⌫</kbd> xoá · <kbd>esc</kbd> đóng · <kbd>⌘⇧V</kbd> mở lại
</p>

<div class="side">
  <div id="win">
    <div class="bar">
      <span>🔍</span>
      <input id="q" placeholder="tìm..." autofocus>
      <span class="peer" id="peer">● nixos</span>
    </div>
    <div id="banner"></div>
    <div id="list"></div>
    <div class="keys">
      <span>↑↓ chọn</span><span>⏎ chép</span><span>⌘P ghim</span>
      <span>⌘⌫ xoá</span><span>esc đóng</span>
    </div>
  </div>

  <div style="display:flex;flex-direction:column;gap:16px">
    <div class="tray">
      <div class="head">x2clip · <b id="trayState">đã kết nối</b></div>
      <div class="head" id="traySub">nixos · 12s trước</div>
      <hr>
      <div class="mi" onclick="open_()">Mở lịch sử <span>⌘⇧V</span></div>
      <div class="mi" id="miPause" onclick="setState(state==='paused'?'ok':'paused')">
        <span id="pauseLabel" style="color:var(--fg)">Tạm dừng sync</span>
      </div>
      <hr>
      <div class="mi">Cấu hình…</div>
      <div class="mi">Thoát</div>
    </div>

    <div class="panel">
      <h4>Thử trạng thái</h4>
      <button data-s="ok" class="on">● bình thường</button>
      <button data-s="offline">○ peer offline</button>
      <button data-s="tailscale">○ Tailscale chưa chạy</button>
      <button data-s="paused">⏸ tạm dừng</button>
      <button data-s="clip">⚠ không đọc được clipboard</button>
      <button data-s="db">⚠ DB lỗi</button>
      <hr style="border:0;border-top:1px solid var(--line);margin:6px 0">
      <button onclick="items=[];render()">lịch sử rỗng</button>
      <button onclick="location.reload()">nạp lại dữ liệu</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
const THUMB = "data:image/svg+xml;utf8," + encodeURIComponent(
  `<svg xmlns="http://www.w3.org/2000/svg" width="96" height="96">
     <rect width="96" height="96" fill="#4c8bf5"/>
     <rect x="8" y="8" width="80" height="18" fill="#fff" opacity=".85"/>
     <rect x="8" y="34" width="52" height="10" fill="#fff" opacity=".5"/>
     <rect x="8" y="50" width="68" height="10" fill="#fff" opacity=".5"/>
     <rect x="8" y="66" width="36" height="10" fill="#fff" opacity=".5"/>
   </svg>`);

let items = [
  { t:"ssh-rsa AAAAB3NzaC1yc2EAAAADAQABAAABgQC7vbqRk9mZ2xJ0pL", when:"2 ngày", pin:true },
  { t:"docker compose up -d --build", when:"3 phút" },
  { t:"Ảnh · 1284×892 · PNG · 412 KB", when:"8 phút", img:true },
  { t:"https://github.com/huy/x2clip/pull/12", when:"12 phút" },
  { t:"nix-shell -p cargo rustc pkg-config xorg.libxcb", when:"20 phút" },
  { t:"x2clip 0.2 — ưu tiên unicode 🐎", when:"31 phút" },
  { t:"Lorem ipsum dolor sit amet, consectetur adipiscing elit, sed do eiusmod tempor", when:"1 giờ" },
  { t:"Ảnh 14 MB — vượt giới hạn, không sync", when:"2 giờ", over:true },
  { t:"/home/huy/.config/x2clip/config.toml", when:"3 giờ" },
];

const STATES = {
  ok:       { dot:"●", tray:"đã kết nối",          sub:"nixos · 12s trước" },
  offline:  { dot:"○", tray:"mất kết nối",         sub:"nixos offline · 4 phút",
              msg:"Không thấy nixos — lịch sử local vẫn chạy", color:"--warn" },
  tailscale:{ dot:"○", tray:"Tailscale chưa chạy", sub:"—",
              msg:"Không kết nối được Tailscale", color:"--error", action:"Mở Tailscale" },
  paused:   { dot:"⏸", tray:"đã tạm dừng",         sub:"không gửi đi",
              msg:"Đang tạm dừng — vẫn lưu local, không gửi đi", color:"--warn" },
  clip:     { dot:"⚠", tray:"lỗi clipboard",       sub:"thiếu DISPLAY",
              msg:"Không đọc được clipboard — thiếu DISPLAY / XAUTHORITY", color:"--error" },
  db:       { dot:"⚠", tray:"lỗi DB",              sub:"lịch sử không mở được",
              msg:"Không mở được lịch sử — file DB có vấn đề. Chưa xoá gì cả.", color:"--error" },
};

let state = "ok", sel = 0;
const $ = id => document.getElementById(id);

function visible() {
  const q = $("q").value.trim().toLowerCase();
  const hit = items.filter(i => !q || i.t.toLowerCase().includes(q));
  return [...hit.filter(i => i.pin), ...hit.filter(i => !i.pin)];  // ghim lên đầu
}

function render() {
  const v = visible();
  if (sel >= v.length) sel = Math.max(0, v.length - 1);

  const s = STATES[state];
  $("peer").textContent = `${s.dot} nixos`;
  $("trayState").textContent = s.tray;
  $("traySub").textContent = s.sub;
  $("pauseLabel").textContent = state === "paused" ? "Tiếp tục sync" : "Tạm dừng sync";

  const b = $("banner");
  b.className = s.msg ? "on" : "";
  if (s.msg) {
    b.style.color = `var(${s.color})`;
    b.style.background = `color-mix(in srgb, var(${s.color}) 12%, transparent)`;
    b.textContent = s.msg;
    if (s.action) {
      const btn = document.createElement("button");
      btn.textContent = s.action;
      b.append(btn);
    }
  }

  const list = $("list");
  list.textContent = "";
  if (!v.length) {
    const e = document.createElement("div");
    e.className = "empty";
    e.textContent = items.length
      ? `Không có item nào khớp “${$("q").value.trim()}”.`
      : "Chưa có gì. Copy một thứ gì đó đi.";
    list.append(e);
    return;
  }
  v.forEach((it, i) => {
    const r = document.createElement("div");
    r.className = "row" + (i === sel ? " sel" : "") + (it.img ? " img" : "") + (it.over ? " over" : "");
    if (it.pin) r.insertAdjacentHTML("beforeend", `<span class="pin">📌</span>`);
    if (it.img) r.insertAdjacentHTML("beforeend", `<img class="thumb" src="${THUMB}" alt="">`);
    r.insertAdjacentHTML("beforeend", `<span class="txt"></span><span class="when"></span>`);
    r.querySelector(".txt").textContent = it.t;
    r.querySelector(".when").textContent = it.when;
    r.onclick = () => { sel = i; use(); };
    list.append(r);
    if (it.pin && v[i + 1] && !v[i + 1].pin)   // kẻ ngăn phần ghim
      list.insertAdjacentHTML("beforeend", `<div class="sep"></div>`);
  });
  list.querySelector(".row.sel")?.scrollIntoView({ block: "nearest" });
}

function toast(m) {
  const t = $("toast");
  t.textContent = m; t.className = "on";
  clearTimeout(toast.id);
  toast.id = setTimeout(() => t.className = "", 1600);
}

function use() {
  const it = visible()[sel];
  if (!it) return;
  close_();
  toast("Đã chép: " + it.t.slice(0, 44) + (it.t.length > 44 ? "…" : ""));
}
function close_() { $("win").classList.add("hidden"); }
function open_() {
  $("win").classList.remove("hidden");
  $("q").value = ""; sel = 0; render(); $("q").focus();   // US-C1: con trỏ sẵn ở ô tìm
}
function setState(s) {
  state = s; render();
  document.querySelectorAll(".panel button[data-s]")
    .forEach(x => x.classList.toggle("on", x.dataset.s === s));
}

$("q").oninput = () => { sel = 0; render(); };

document.addEventListener("keydown", e => {
  const mod = e.metaKey || e.ctrlKey;

  if ($("win").classList.contains("hidden")) {
    if (mod && e.shiftKey && e.key.toLowerCase() === "v") { e.preventDefault(); open_(); }
    return;
  }
  const v = visible();

  if (e.key === "Escape") {
    e.preventDefault(); close_();
    toast("Đã đóng — clipboard không đổi");          // US-C1
  } else if (e.key === "ArrowDown") {
    e.preventDefault(); sel = Math.min(sel + 1, v.length - 1); render();
  } else if (e.key === "ArrowUp") {
    e.preventDefault(); sel = Math.max(sel - 1, 0); render();
  } else if (e.key === "Enter") {
    e.preventDefault(); use();
  } else if (mod && e.key.toLowerCase() === "p") {
    e.preventDefault();
    const it = v[sel]; if (!it) return;
    it.pin = !it.pin;                                 // cửa sổ KHÔNG đóng
    toast(it.pin ? "Đã ghim" : "Đã bỏ ghim"); render();
  } else if (mod && (e.key === "Backspace" || e.key === "Delete")) {
    e.preventDefault();
    const it = v[sel]; if (!it) return;
    items = items.filter(x => x !== it);              // xoá một item: không hỏi
    toast("Đã xoá 1 item"); render();
  }
});

document.querySelectorAll(".panel button[data-s]").forEach(b => {
  b.onclick = () => setState(b.dataset.s);
});

render();
$("q").focus();
</script>
